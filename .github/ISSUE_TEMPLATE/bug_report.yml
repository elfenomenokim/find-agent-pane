name: Bug report
description: A pane was classified as the wrong agent, as unknown, or missed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security problem here. Use the Security tab's
        "Report a vulnerability" form. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The output line for the pane and what actually runs in it.
      placeholder: |
        %7  codex  50112  ~/src/web   (but the pane runs opencode)
    validations:
      required: true
  - type: textarea
    id: tree
    attributes:
      label: Process tree of the pane
      description: |
        Output of `ps -ww -e -o pid=,ppid=,pgid=,tpgid=,stat=,tty=,ucomm=,args=` limited to the pane
        pid and its descendants (`tmux display -p -t %7 '#{pane_pid}'`). Remove secrets.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: find-agent-pane 0.1.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform, tmux and agent versions
      placeholder: macOS 27 arm64, tmux 3.5a, Claude Code 2.1.329
    validations:
      required: true
