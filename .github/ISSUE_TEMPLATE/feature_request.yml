name: New agent or feature
description: An agent the table does not know yet, or a missing option.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The tool does one job: say which coding agent owns each tmux pane, from process
        evidence. For a new agent, the process tree of a pane running it is the most useful part.
  - type: textarea
    id: request
    attributes:
      label: Request
      description: The agent (name, install command, executable) or the option you need.
    validations:
      required: true
  - type: textarea
    id: tree
    attributes:
      label: Process tree (for a new agent)
      render: text
