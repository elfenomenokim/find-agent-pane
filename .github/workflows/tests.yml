name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Python versions on Linux; macOS once (macOS runners are scarce and queued jobs got cancelled).
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # ubuntu-latest no longer ships Python 3.9
          - os: ubuntu-22.04
            python: "3.9"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests
      - name: live smoke (a real tmux pane)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y tmux >/dev/null
          tmux -L ci new-session -d -s ci 'bash -i'
          sleep 1
          python -m find_agent_pane -L ci --all
          tmux -L ci kill-server
